
# ============================================================
# PHASE 3: KAFKA STREAMING CONFIGURATION
# ============================================================
# Purpose:
# Run a single-node Apache Kafka broker using Docker Compose.
# Kafka uses KRaft mode, so Zookeeper is not required.
# ============================================================

services:

  # ----------------------------------------------------------
  # PROCESS 1: KAFKA BROKER
  # ----------------------------------------------------------
  kafka:

    image: apache/kafka:latest

    container_name: dow-kafka

    ports:
      - "9092:9092"

    environment:

      # Kafka node configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Network listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Controller configuration
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-node replication settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Cluster configuration
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: unless-stopped

# ------------------------------------------------------------
# PROCESS 2: PERSISTENT KAFKA STORAGE
# ------------------------------------------------------------

volumes:
  kafka_data:
